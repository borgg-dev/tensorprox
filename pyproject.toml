[project]
name = "tensorprox-subnet"
version = "1.0.0"
description = "TensorProx Subnet - Decentralized DDoS Protection Network on Bittensor"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "TensorProx Team" }
]
keywords = [
    "bittensor",
    "subnet",
    "ddos",
    "protection",
    "decentralized",
    "scrubber",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

dependencies = [
    # Bittensor core
    "bittensor>=9.0.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # HTTP requests
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    # SSH operations
    "paramiko>=3.0.0",
    # Logging
    "loguru>=0.7.0",
    # Scientific computing
    "numpy>=1.24.0",
    # Control plane dependencies
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=7.0.1",
    "cryptography>=42.0.0",
    "pynacl>=1.5.0",
    "psutil>=5.9.0",
    # Database ORM and migrations
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    # Date parsing
    "python-dateutil>=2.8.0",
    # Packet crafting for validator audits
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests",
    "types-paramiko",
]
monitoring = [
    "wandb>=0.15.0",
]
redis = [
    "redis>=7.0.1",
]
all = [
    "tensorprox-subnet[dev,monitoring,redis]",
]

[project.scripts]
tensorprox-miner = "neurons.miner:main"
tensorprox-validator = "neurons.validator:main"

[project.urls]
Homepage = "https://github.com/shugo-labs/tensorprox"
Documentation = "https://github.com/shugo-labs/tensorprox#readme"
Repository = "https://github.com/shugo-labs/tensorprox.git"
Issues = "https://github.com/shugo-labs/tensorprox/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tensorprox", "neurons", "shared", "miner_control_plane"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | configs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["tensorprox", "neurons", "shared", "miner_control_plane"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
