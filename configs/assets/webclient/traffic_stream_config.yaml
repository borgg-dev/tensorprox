# Traffic Stream Client Configuration
# Continuous synthetic traffic generator for edge platform validation

defaults:
  tcp_ports:
    echo: 7011
    http: 7022
    custom: 7033
  udp_ports:
    echo: 7111
    dgram: 7112
    custom: 7113

# Service weights (must sum to 100)
# HTTP-heavy to simulate realistic web traffic
service_weights:
  tcp_http: 60
  tcp_echo: 15
  tcp_custom: 10
  udp_echo: 5
  udp_dgram: 5
  udp_custom: 5

# Traffic patterns
patterns:
  burst:
    requests: "3-10"        # requests per burst
    interval_ms: "100-500"  # between requests in burst
    pause_s: "5-30"         # after burst completes
  steady:
    interval_s: "1-3"       # between requests
    duration_m: "5-15"      # how long to stay in steady
  idle:
    duration_s: "60-300"    # idle period length
    probability: 0.1        # 10% chance to enter idle after burst

# Time-of-day traffic multipliers (24h format)
# Lower multiplier = longer delays = less traffic
time_of_day:
  "00-06": 0.3   # night: 30% of normal rate
  "06-09": 0.7   # early morning: ramp up
  "09-17": 1.0   # business hours: full rate
  "17-21": 0.8   # evening: slight reduction
  "21-24": 0.5   # late night: wind down

# Origins to test
# Add more origins here, each gets an independent traffic stream
origins:
  - ip: 203.0.113.50   # RFC 5737 TEST-NET-3 - replace with your origin IP
    # Uses default ports
